name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        # actions/checkout v7, pinned to the immutable v7 release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7, pinned to the immutable v7 release commit.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run packaged self-test
        run: python skills/dxm/scripts/scaffold_dxm.py --self-test

      - name: Verify copied-skill entry points
        run: |
          python skills/dxm/scripts/dxm.py --version
          python skills/dxm/scripts/validate_dxm.py --version
